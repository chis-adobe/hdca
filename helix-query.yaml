version: 1

indices:
  products:
    include:
      - '/fragments/products/**'
    target: /product-index.json
    properties:
      productName:
        select: .product-details > div:nth-child(2) > div:nth-child(2)
        value: |
          textContent(el)
      brand:
        select: .product-details > div:nth-child(3) > div:nth-child(2)
        value: |
          textContent(el)
      price:
        select: .product-details > div:nth-child(4) > div:nth-child(2)
        value: |
          textContent(el)
      sku:
        select: .product-details > div:nth-child(7) > div:nth-child(2)
        value: |
          textContent(el)
      reviewCount:
        select: .product-details > div:nth-child(19) > div:nth-child(2)
        value: |
          textContent(el)
      rating:
        select: .product-details > div:nth-child(21) > div:nth-child(2)
        value: |
          textContent(el)
      savings:
        select: .product-details > div:nth-child(22) > div:nth-child(2)
        value: |
          textContent(el)
      originalPrice:
        select: .product-details > div:nth-child(23) > div:nth-child(2)
        value: |
          textContent(el)
      imageSrc:
        select: .product-details > div:nth-child(1) > div:nth-child(2) picture:first-of-type img
        value: |
          attribute(el, 'src')

  departments:
    include:
      - '/dept/**'
    target: /dept-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      image:
        select: main img
        value: |
          attribute(el, 'src')
